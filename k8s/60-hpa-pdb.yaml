apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: backend-hpa }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: backend }
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
  behavior:
    scaleDown: { stabilizationWindowSeconds: 120 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: backend-pdb }
spec: { minAvailable: 2, selector: { matchLabels: { app: backend } } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: frontend-pdb }
spec: { minAvailable: 1, selector: { matchLabels: { app: frontend } } }
