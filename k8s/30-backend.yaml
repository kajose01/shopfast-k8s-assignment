apiVersion: v1
kind: Service
metadata: { name: backend }
spec:
  type: ClusterIP
  selector: { app: backend }
  ports: [{ port: 5000, targetPort: 5000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: backend }
spec:
  replicas: 3
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app: backend } }
  template:
    metadata: { labels: { app: backend } }
    spec:
      terminationGracePeriodSeconds: 30
      imagePullSecrets: [{ name: regcred }]
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector: { matchLabels: { app: backend } }
      containers:
      - name: backend
        image: kaj1/shopfast-backend:v1
        ports: [{ containerPort: 5000 }]
        envFrom: [{ configMapRef: { name: shopfast-config } }]
        env:
        - name: MONGO_URL
          valueFrom: { secretKeyRef: { name: shopfast-secret, key: MONGO_URL } }
        resources:
          requests: { cpu: 100m, memory: 128Mi }
          limits:   { cpu: 500m, memory: 256Mi }
        readinessProbe: { httpGet: { path: /readyz,  port: 5000 }, periodSeconds: 5, failureThreshold: 3 }
        livenessProbe:  { httpGet: { path: /healthz, port: 5000 }, initialDelaySeconds: 10, periodSeconds: 10 }
        lifecycle: { preStop: { exec: { command: ["sleep","5"] } } }   # drain endpoints -> no 503s on rollout
        volumeMounts: [{ name: logs, mountPath: /var/log/app }]
      - name: log-sidecar              # BONUS: sidecar ships app log file to stdout
        image: busybox:1.36
        args: ["sh","-c","touch /var/log/app/app.log; tail -n+1 -F /var/log/app/app.log"]
        resources:
          requests: { cpu: 10m, memory: 16Mi }
          limits:   { cpu: 50m, memory: 32Mi }
        volumeMounts: [{ name: logs, mountPath: /var/log/app }]
      volumes: [{ name: logs, emptyDir: {} }]
