apiVersion: v1
kind: Service
metadata: { name: payment }
spec:
  selector: { app: payment }
  ports: [{ port: 5001, targetPort: 5001 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: payment }
spec:
  replicas: 2
  selector: { matchLabels: { app: payment } }
  template:
    metadata: { labels: { app: payment } }
    spec:
      imagePullSecrets: [{ name: regcred }]
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector: { matchLabels: { app: payment } }
      containers:
      - name: payment
        image: kaj1/shopfast-payment:v1
        ports: [{ containerPort: 5001 }]
        resources:
          requests: { cpu: 50m,  memory: 64Mi }
          limits:   { cpu: 250m, memory: 128Mi }
        readinessProbe: { httpGet: { path: /health, port: 5001 }, periodSeconds: 5 }
        livenessProbe:  { httpGet: { path: /health, port: 5001 }, initialDelaySeconds: 10, periodSeconds: 10 }
