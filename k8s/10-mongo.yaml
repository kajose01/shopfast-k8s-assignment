apiVersion: v1
kind: Service
metadata: { name: mongodb }
spec:
  clusterIP: None            # headless -> stable DNS mongo-0.mongodb
  selector: { app: mongo }
  ports: [{ port: 27017, name: mongo }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: mongo }
spec:
  serviceName: mongodb
  replicas: 1
  selector: { matchLabels: { app: mongo } }
  template:
    metadata: { labels: { app: mongo } }
    spec:
      containers:
      - name: mongo
        image: mongo:7
        args: ["--wiredTigerCacheSizeGB","0.25"]
        ports: [{ containerPort: 27017 }]
        envFrom: [{ secretRef: { name: shopfast-secret } }]
        resources:
          requests: { cpu: 200m, memory: 512Mi }
          limits:   { cpu: "1",  memory: 1Gi }
        readinessProbe:
          exec: { command: ["mongosh","--quiet","--eval","db.adminCommand('ping').ok"] }
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          exec: { command: ["mongosh","--quiet","--eval","db.adminCommand('ping').ok"] }
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts: [{ name: data, mountPath: /data/db }]
  volumeClaimTemplates:      # creates a PVC (+ PersistentVolume dynamically)
  - metadata: { name: data }
    spec:
      accessModes: ["ReadWriteOnce"]
      resources: { requests: { storage: 5Gi } }
