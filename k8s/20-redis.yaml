apiVersion: v1
kind: Service
metadata: { name: redis }
spec:
  selector: { app: redis }
  ports: [{ port: 6379 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis }
spec:
  replicas: 2   # independent cache nodes; fine for a cache
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        args: ["--maxmemory","100mb","--maxmemory-policy","allkeys-lru"]
        ports: [{ containerPort: 6379 }]
        resources:
          requests: { cpu: 50m,  memory: 128Mi }
          limits:   { cpu: 250m, memory: 160Mi }   # limit > maxmemory + overhead (the FIX)
        readinessProbe: { exec: { command: ["redis-cli","ping"] }, periodSeconds: 5 }
        livenessProbe:  { exec: { command: ["redis-cli","ping"] }, initialDelaySeconds: 10, periodSeconds: 10 }
