apiVersion: v1
kind: Service
metadata: { name: frontend }
spec:
  type: NodePort
  selector: { app: frontend }
  ports: [{ port: 3000, targetPort: 3000, nodePort: 30080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: frontend }
spec:
  replicas: 2
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      imagePullSecrets: [{ name: regcred }]
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector: { matchLabels: { app: frontend } }
      containers:
      - name: frontend
        image: kaj1/shopfast-frontend:v1
        ports: [{ containerPort: 3000 }]
        resources:
          requests: { cpu: 50m,  memory: 32Mi }
          limits:   { cpu: 250m, memory: 128Mi }
        readinessProbe: { httpGet: { path: /healthz, port: 3000 }, periodSeconds: 5 }
        livenessProbe:  { httpGet: { path: /healthz, port: 3000 }, initialDelaySeconds: 5, periodSeconds: 10 }
