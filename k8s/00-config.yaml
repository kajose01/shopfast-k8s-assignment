apiVersion: v1
kind: ConfigMap
metadata: { name: shopfast-config }
data:
  PORT: "5000"
  REDIS_URL: redis://redis:6379
  PAYMENT_URL: http://payment:5001
---
apiVersion: v1
kind: Secret
metadata: { name: shopfast-secret }
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: admin
  MONGO_INITDB_ROOT_PASSWORD: change-me-please
  MONGO_URL: mongodb://admin:change-me-please@mongodb:27017/shopfast?authSource=admin
